[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cmdline-parser"
dynamic = ["version"]
description = "Error-tolerant command-line text analyzer for security log search"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: Text Processing",
]

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6.100"]
dev = ["pytest>=8", "hypothesis>=6.100", "build>=1.2"]

[project.scripts]
cmdline-parser = "cmdline_parser.cli:main"

[tool.setuptools.dynamic]
version = { attr = "cmdline_parser.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra"
